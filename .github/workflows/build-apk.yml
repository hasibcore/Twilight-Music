name: Build & Release Twilight Android APK, iOS IPA & Windows EXE (v3.6.3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twilight-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: v3.0.0
  NEW_RELEASE_TAG: v3.6.3
  RELEASE_NAME: "Twilight Music v3.6.3 — Official Android APK, iOS IPA & Windows PC Release"
  LEGACY_RELEASE_NAME: "Twilight Music v3.0.0 — Official Android APK, iOS IPA & Windows PC Release"

jobs:
  # ---------------------------------------------------------------------------
  # 1. ANDROID RELEASE APK + FULL PROJECT SOURCE ZIP (Ubuntu Runner)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK (v3.6.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Unit & Widget Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Twilight-Android-v3.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Twilight-Android-v3.5.2.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Twilight-Android-v3.6.3.apk

      - name: Package Full Project Release ZIP
        run: |
          zip -r Twilight-Music-v3.6.3-Full-Project.zip . \
            -x "node_modules/*" ".git/*" "build/*" ".dart_tool/*" "dist/*"
          cp Twilight-Music-v3.6.3-Full-Project.zip Twilight-Music-v3.0.0-Full-Project.zip

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twilight-Android-v3.6.3
          path: |
            build/app/outputs/flutter-apk/Twilight-Android-v3.6.3.apk
            build/app/outputs/flutter-apk/Twilight-Android-v3.5.2.apk
            build/app/outputs/flutter-apk/Twilight-Android-v3.0.0.apk
            build/app/outputs/flutter-apk/app-release.apk
            Twilight-Music-v3.6.3-Full-Project.zip

      - name: Publish New Android APK Release (v3.6.3)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.NEW_RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          body: |
            # 🌙 Twilight Music v3.6.3 (Build 63) — Download Completion, Exact YouTube Playback & Reliability Release

            Clean, fast, ad-free music streaming & offline download app for **Android**, **Apple iOS**, **Windows PC**, and **Web**.

            ---

            ### 📦 Official Platform Downloads:
            | Platform | Direct Download | Installation Guide |
            |---|---|---|
            | 🤖 **Android (APK - Newest v3.6.3)** | [**`Twilight-Android-v3.6.3.apk`**](https://github.com/${{ github.repository }}/releases/download/v3.6.3/Twilight-Android-v3.6.3.apk) | Direct APK install for Android 7.0+ (Version 3.6.3+63) |
            | 🤖 **Android (APK - Generic Alias)** | [**`app-release.apk`**](https://github.com/${{ github.repository }}/releases/download/v3.6.3/app-release.apk) | Identical signed release APK (`3.6.3+63`) |
            | 🍏 **Apple iOS (IPA)** | [**`Twilight-iOS-v3.6.3.ipa`**](https://github.com/${{ github.repository }}/releases/download/v3.6.3/Twilight-iOS-v3.6.3.ipa) | Sideload via AltStore, Sideloadly, Scarlet, or TrollStore |
            | 💻 **Windows PC (x64)** | [**`Twilight-Windows-x64-v3.6.3.zip`**](https://github.com/${{ github.repository }}/releases/download/v3.6.3/Twilight-Windows-x64-v3.6.3.zip) | Extract ZIP and run `Twilight.exe` on Windows 10/11 (64-bit) |
            | 📦 **Full Source Code** | [**`Twilight-Music-v3.6.3-Full-Project.zip`**](https://github.com/${{ github.repository }}/releases/download/v3.6.3/Twilight-Music-v3.6.3-Full-Project.zip) | Complete Flutter + React/Express source bundle |

            ---

            ### ✨ What's New in v3.6.3 (Build 63):
            - **Instant Play Start & Loading Fix**: Standard YouTube tracks now start immediately through exact-video IFrame playback instead of waiting on remote stream resolution.
            - **Reliable Card Artwork**: Broken or missing track, mix, and artist images now fall back to the Twilight app icon instead of rendering empty placeholders.
            - **Zero Download Stalls at 98%-99%**: Fixed infinite chunk retry loops on HTTP 403/503 responses, buffered Range chunks atomically, replaced rigid 60s download timeouts with an inactivity watchdog, added `headersTimeoutOnly` streaming for `/api/download/:videoId`, and guarded IndexedDB completion against aborted/blocked transactions.
            - **100% Exact YouTube Video Audio Matching**: Non-curated YouTube videos play their exact clicked video audio directly without substituting third-party studio/cover recordings, and offline caches validate duration before saving or playing.
            - **Instant Next-Track Switching & Zero Loading Stalls**: Fixed AbortError retries, synchronous playback state resets, `audio.load()` pipeline resets, and queue alignment when switching songs.
            - **Full Playlists Upgrade**: Create, rename, delete, shuffle, play all, toggle tracks in/out of playlists, and add songs directly from Home, Explore, Search, Library, and the Player.
            - **Smart Search & Bengali Phonetic Matching**: Fixed phonetic queries (e.g. `tmi` / `tmi level 5` -> `LEVEL FIVE - TUMI`) and colon-separated movie song titles.
            - **Guest-First Clean Startup & Working Auth**: Removed hardcoded personal login accounts and verified full Email/Password Sign-Up, Sign-In, and Sign-Out.
            - **Zero Console Errors & Multi-Platform Reliability**: Eliminated YouTube search soft-timeout noise and unnecessary 502 offline-check requests alongside tuned Android ExoPlayer buffering and hardened network security.
          files: |
            build/app/outputs/flutter-apk/Twilight-Android-v3.6.3.apk
            build/app/outputs/flutter-apk/app-release.apk
            Twilight-Music-v3.6.3-Full-Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Legacy Mirror Release (v3.0.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.LEGACY_RELEASE_NAME }}
          make_latest: false
          files: |
            build/app/outputs/flutter-apk/Twilight-Android-v3.6.3.apk
            build/app/outputs/flutter-apk/Twilight-Android-v3.5.2.apk
            build/app/outputs/flutter-apk/Twilight-Android-v3.0.0.apk
            build/app/outputs/flutter-apk/app-release.apk
            Twilight-Music-v3.0.0-Full-Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. WINDOWS DESKTOP RELEASE x64 ZIP (Windows Runner)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows x64 Release (v3.6.3)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Get Dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows x64 Release Executable
        run: flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Twilight-Windows-x64-v3.6.3.zip" -Force
          Copy-Item "Twilight-Windows-x64-v3.6.3.zip" "Twilight-Windows-x64-v3.0.0.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twilight-Windows-x64-v3.6.3
          path: Twilight-Windows-x64-v3.6.3.zip

      - name: Attach Windows x64 ZIP to GitHub Release (v3.6.3)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.NEW_RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          files: |
            Twilight-Windows-x64-v3.6.3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Windows x64 ZIP to Mirror Release (v3.0.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.LEGACY_RELEASE_NAME }}
          make_latest: false
          files: |
            Twilight-Windows-x64-v3.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. APPLE iOS RELEASE IPA (macOS Runner)
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build Apple iOS IPA (v3.6.3)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Unsigned iOS Release App & Package IPA
        run: |
          flutter build ios --config-only --release --no-codesign
          if [ -f ios/Podfile ]; then (cd ios && pod install); fi
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO
          mkdir -p Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/Runner.app
          zip -r Twilight-iOS-v3.6.3.ipa Payload
          cp Twilight-iOS-v3.6.3.ipa Twilight-iOS-v3.0.0.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twilight-iOS-v3.6.3
          path: Twilight-iOS-v3.6.3.ipa

      - name: Attach iOS IPA to GitHub Release (v3.6.3)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.NEW_RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          files: |
            Twilight-iOS-v3.6.3.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach iOS IPA to Mirror Release (v3.0.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.LEGACY_RELEASE_NAME }}
          make_latest: false
          files: |
            Twilight-iOS-v3.0.0.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
